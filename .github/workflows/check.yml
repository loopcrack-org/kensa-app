# The only automated check this repository has, and it exists because the
# triage classifier is the one piece of behaviour here that can be wrong
# silently: a verdict that fails to validate applies nothing and leaves
# `needs-triage`, which looks exactly like a quiet day.
#
# Node's built-in runner, so there is no package.json, no dependency and no
# lockfile to keep current in a repository that otherwise holds only documents.

name: Check

on:
  pull_request:
    paths: ['.github/scripts/**']
  push:
    branches: [main]
    paths: ['.github/scripts/**']

permissions:
  contents: read

jobs:
  triage-script:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: whoever controls the
      # action can move it, and this workflow then runs different code on an
      # issue body written by a stranger. Resolved from the release tag and
      # recorded beside it so the next bump is a deliberate edit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Named explicitly rather than pointed at the directory: `--test` on a
      # folder treats triage.mjs itself as a test file and fails it for
      # containing none.
      - run: node --test .github/scripts/triage.test.mjs
